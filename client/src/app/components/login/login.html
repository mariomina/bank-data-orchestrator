<div class="login-container">
    <div class="login-card">
        <div class="login-header">
            <div class="icon-container">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
            </div>
            <h1>Bienvenido</h1>
            <p>Accede al Orquestador Bancario</p>
        </div>

        <form (ngSubmit)="onSubmit()">
            <div class="form-group">
                <label for="username">Usuario</label>
                <input type="text" id="username" [ngModel]="username()" (ngModelChange)="username.set($event)"
                    name="username" placeholder="Ej: admin" required>
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" [ngModel]="password()" (ngModelChange)="password.set($event)"
                    name="password" placeholder="••••••••" required>
            </div>

            <div *ngIf="errorMessage()" class="error-alert">
                {{ errorMessage() }}
            </div>

            <button type="submit" [disabled]="isLoading()">
                <span *ngIf="!isLoading()">Ingresar</span>
                <span *ngIf="isLoading()">Verificando...</span>
            </button>
        </form>
    </div>
</div>
