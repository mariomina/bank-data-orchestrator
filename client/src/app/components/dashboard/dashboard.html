<div class="dashboard-container">
  <header>
    <h1>Orquestador de Datos</h1>
    <p class="subtitle">Panel de Control de Clientes Bancarios</p>
  </header>

  <div *ngIf="loading()" class="status-container">
    <div class="loading-spinner"></div>
  </div>

  <div *ngIf="error()" class="status-container">
    <div class="error-message">
      {{ error() }}
      <button (click)="fetchData()" style="margin-left: 1rem; cursor: pointer;">Reintentar</button>
    </div>
  </div>

  <div *ngIf="!loading() && !error()" class="grid-container">
    <div class="card" *ngFor="let user of users()">
      <div class="card-header">
        <div class="avatar">{{ user.name.charAt(0) }}</div>
        <div class="user-info">
          <h2>{{ user.name }}</h2>
          <p>{{ user.email }}</p>
        </div>
      </div>

      <div class="card-details">
        <div class="detail-item">
          <span class="label">ID Cliente</span>
          <span class="value">#{{ user.id | number:'3.0-0' }}</span>
        </div>
        <div class="detail-item">
          <span class="label">Empresa</span>
          <span class="value">{{ user.company }}</span>
        </div>
        <div class="detail-item">
          <span class="label">Ciudad</span>
          <span class="value">{{ user.city }}</span>
        </div>
      </div>
    </div>
  </div>
</div>
